<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid</title>
    <link rel="stylesheet" href="css/custom.css">
</head>
<body>
    <h1>Grid Lessons</h1>
    <div class="grid">
        <div style="background-color: red;">1</div>
        <div style="background-color: yellow;">2</div>
        <div style="background-color: brown;">3</div>
        <div style="background-color: green;">4</div>
        <div style="background-color: pink;">5</div>
        <div style="background-color: blue;">6</div>
        <div style="background-color: rgb(51, 222, 29);">7</div>
        <div style="background-color: gray;">8</div>
        <div style="background-color: violet;">9</div>
        
    </div>
    <br>
    <div class="gridrow">
        <div style="background-color: red;" class="rowadd">1</div>
        <div style="background-color: yellow;">2</div>
        <div style="background-color: brown;">3</div>
        <div style="background-color: green;">4</div>
        <div style="background-color: pink;">5</div>
        <div style="background-color: blue;">6</div>
        <div style="background-color: rgb(51, 222, 29);">7</div>
        <div style="background-color: gray;">8</div>
        <div style="background-color: violet;">9</div>
        
    </div>
     <br>
    <div class="gridcolumn">
        <div style="background-color: red;" >1</div>
        <div style="background-color: yellow;">2</div>
        <div style="background-color: brown;">3</div>
        <div style="background-color: green;">4</div>
        <div style="background-color: pink;"class="columnadd">5</div>
        <div style="background-color: blue;">6</div>
        <div style="background-color: rgb(51, 222, 29);">7</div>
        <div style="background-color: gray;">8</div>
        <div style="background-color: violet;">9</div>
        
    </div>
    
</body>
</html>
